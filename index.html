<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>홈루덴스 AS 진행관리</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: 상단 탭 바 + 단일 작업 영역. 현황판(구분 카드 + 표) → AS 기록(정보 + 진행 기록) → 작성(폼). 클레임 보고서와 같은 토큰을 쓴다. */
:root{
  --paper:#f5f6f3; --sheet:#ffffff; --ink:#1d2532; --ink-2:#4d5766; --ink-3:#7c8592;
  --line:#dde1dc; --line-2:#c9cec8; --tint:#eef1ec;
  --brand:#FFC400; --brand-ink:#1d2532; --accent:#8a6100; --accent-ink:#1d2532; --accent-soft:#fff3c4;
  --sev-s:#b4322a; --sev-s-bg:#fbe7e4; --sev-a:#a6620a; --sev-a-bg:#fcefd9; --sev-b:#46627a; --sev-b-bg:#e6edf3;
  --ok:#2f7a4d; --ok-bg:#e2f1e7; --stamp:#c0392b;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-doc:var(--f-body);
  --logo-filter:none;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14181e; --sheet:#1b2028; --ink:#e7eaee; --ink-2:#b2b9c3; --ink-3:#848c97;
  --line:#2c333d; --line-2:#3a424d; --tint:#222831;
  --brand:#FFC83D; --brand-ink:#1b1606; --accent:#ffd466; --accent-ink:#1b1606; --accent-soft:#3a2f12;
  --sev-s:#f08a7f; --sev-s-bg:#3a1f1d; --sev-a:#e8b15a; --sev-a-bg:#362a15; --sev-b:#9fb8cf; --sev-b-bg:#202c38;
  --ok:#7ccb98; --ok-bg:#1a3123; --stamp:#ef7d6f; --logo-filter:invert(1); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14181e; --sheet:#1b2028; --ink:#e7eaee; --ink-2:#b2b9c3; --ink-3:#848c97;
  --line:#2c333d; --line-2:#3a424d; --tint:#222831;
  --brand:#FFC83D; --brand-ink:#1b1606; --accent:#ffd466; --accent-ink:#1b1606; --accent-soft:#3a2f12;
  --sev-s:#f08a7f; --sev-s-bg:#3a1f1d; --sev-a:#e8b15a; --sev-a-bg:#362a15; --sev-b:#9fb8cf; --sev-b-bg:#202c38;
  --ok:#7ccb98; --ok-bg:#1a3123; --stamp:#ef7d6f; --logo-filter:invert(1); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--brand)}
.bar-in{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand img{height:20px;width:auto;display:block;filter:var(--logo-filter)}
.brand span{font-size:13px;color:var(--ink-2);font-weight:500;padding-left:10px;border-left:1px solid var(--line-2)}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:6px 12px;border-radius:var(--r);color:var(--ink-2);font-weight:500}
.tab[aria-current="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.btn{border:1px solid var(--line-2);background:var(--sheet);padding:7px 14px;border-radius:var(--r);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--sev-s);border-color:var(--sev-s)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}

h1.page{font-size:24px;font-weight:700;margin:28px 0 4px;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--ink-3);margin:0 0 20px;font-size:13px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.kpi{background:var(--sheet);padding:12px 16px}
.kpi small{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.kpi strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi strong em{font-style:normal;font-size:13px;color:var(--ink-3);font-weight:500;margin-left:2px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:5px 11px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.flabel{font-size:12px;color:var(--ink-3);margin-right:6px}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 10px;background:var(--sheet)}
select.sm{border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;background:var(--sheet);font-size:13px}

/* ledger table */
.tbl-wrap{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--tint)}
.ledger td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr:hover td{background:var(--tint)}
.ledger tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.01em;white-space:nowrap}
.cust b{font-weight:600;display:block}
.cust span{color:var(--ink-3);font-size:12px}
.over{color:var(--sev-s);font-weight:600}
@media (max-width:720px){
  table.ledger thead{display:none}
  table.ledger,table.ledger tbody,table.ledger tr,table.ledger td{display:block}
  table.ledger tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.ledger td{border:0;padding:0}
  table.ledger td[data-c="hide"]{display:none}
  table.ledger td.num{text-align:right}
}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sev-S{color:var(--sev-s);background:var(--sev-s-bg)}
.sev-A{color:var(--sev-a);background:var(--sev-a-bg)}
.sev-B{color:var(--sev-b);background:var(--sev-b-bg)}
.st-접수{color:var(--sev-a);background:var(--sev-a-bg)}
.st-처리중{color:var(--accent);background:var(--accent-soft)}
.st-종결{color:var(--ok);background:var(--ok-bg)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.ex-strip{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;padding:12px 14px;background:var(--accent-soft);border-radius:var(--r)}
.ex-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.ex-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ex-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.ex-card{border:1px solid var(--line-2);background:var(--sheet);border-radius:var(--r);padding:9px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.ex-card span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-card:hover{border-color:var(--accent)}
.ex-card b{font-size:13px;font-weight:600}
.ex-card span{font-size:12px;color:var(--ink-3)}
.ex-hint{font-size:12px;color:var(--ink-2)}
.ex-note{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin-top:12px;font-size:13px}
.ex-note b{color:var(--accent)}
.ex-note span{flex:1 1 300px;min-width:0}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.pill.ex{color:var(--accent);background:var(--accent-soft)}
.empty{background:var(--sheet);border:1px dashed var(--line-2);border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:17px;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0 0 16px}

/* report document */
.doc{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(16px,4vw,40px);margin-top:16px}
.doc-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:18px}
@media (max-width:720px){.doc-head{grid-template-columns:minmax(0,1fr)}}
.doc-title{font-size:26px;font-weight:700;letter-spacing:.2em;margin:0}
.doc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.approve{border-collapse:collapse;font-size:12px}
.approve th{font-weight:500;color:var(--ink-2);border:1px solid var(--line-2);padding:4px 6px;min-width:64px;background:var(--tint)}
.approve td{border:1px solid var(--line-2);height:62px;padding:0;text-align:center;vertical-align:middle}
.approve td.off{background:repeating-linear-gradient(135deg,var(--tint) 0 6px,var(--sheet) 6px 12px)}
.approve td.off span{color:var(--ink-3);font-size:11px}
.stamp-btn{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);font-size:11px}
.stamp-btn:hover{background:var(--accent-soft);color:var(--accent)}
.stamp{width:40px;height:40px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);display:flex;align-items:center;justify-content:center;font-family:var(--f-doc);font-weight:800;font-size:13px;transform:rotate(-8deg)}
.stamp-date{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.approve-route{font-size:12px;color:var(--ink-3);margin-top:6px;text-align:right}

.sec{padding-top:22px}
.sec h2{font-size:15px;font-weight:700;margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.sec h2 i{font-style:normal;font-family:var(--f-mono);color:var(--accent);font-size:13px}
.guide{font-size:12px;color:var(--ink-3);margin:0 0 10px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.kv > div{display:grid;grid-template-columns:120px minmax(0,1fr);border-bottom:1px solid var(--line)}
.kv > div.wide{grid-column:1/-1}
.kv dt{background:var(--tint);color:var(--ink-2);font-size:12px;font-weight:500;padding:9px 12px}
.kv dd{margin:0;padding:9px 12px;white-space:pre-wrap;word-break:break-word;min-width:0}
.kv dd.blank{color:var(--ink-3)}
@media (max-width:720px){.kv{grid-template-columns:minmax(0,1fr)}.kv > div{grid-template-columns:96px minmax(0,1fr)}}
.cost{width:100%;border-collapse:collapse;font-size:13px}
.cost th,.cost td{border-bottom:1px solid var(--line);padding:8px 12px;text-align:left}
.cost th{background:var(--tint);color:var(--ink-2);font-weight:500;font-size:12px}
.cost tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.photo{position:relative;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--tint)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;top:6px;right:6px;border:0;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px}
.dropzone{border:1px dashed var(--line-2);border-radius:var(--r);display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;color:var(--ink-3);font-size:13px;cursor:pointer;background:none;text-align:center;padding:8px}
.dropzone:hover{border-color:var(--accent);color:var(--accent)}
.sign{text-align:center;padding-top:28px;color:var(--ink-2);font-weight:600}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}
.back{margin-top:20px}

/* form */
.form-sec{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px clamp(16px,3vw,28px);margin-top:14px}
.form-sec h2{font-size:15px;margin:0 0 2px;display:flex;gap:8px;align-items:baseline}
.form-sec h2 i{font-style:normal;font-family:var(--f-mono);color:var(--accent);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin-top:12px}
.grid .wide{grid-column:1/-1}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > label,.fld > .lbl{font-size:12px;font-weight:500;color:var(--ink-2)}
.fld input[type=text],.fld input[type=date],.fld input[type=datetime-local],.fld input[type=number],.fld select,.fld textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;background:var(--sheet);width:100%;min-width:0}
.fld textarea{min-height:76px;resize:vertical}
.fld .hint{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;background:var(--sheet)}
.chip input:checked + span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.auto{background:var(--tint);border-radius:var(--r);padding:8px 10px;font-size:13px}
.cost-in{width:100%;border-collapse:collapse;margin-top:12px}
.cost-in td,.cost-in th{padding:6px 6px 6px 0;text-align:left;font-size:13px}
.cost-in th{font-weight:500;color:var(--ink-3);font-size:12px}
.cost-in input{border:1px solid var(--line-2);border-radius:var(--r);padding:7px 10px;background:var(--sheet);width:100%;min-width:0}
.cost-in input.money{text-align:right;font-variant-numeric:tabular-nums}
.cost-in tr.total td{font-weight:700;border-top:2px solid var(--ink);padding-top:10px}
.save-bar{position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--line);margin-top:20px;display:flex;justify-content:flex-end;gap:8px;padding-top:12px}

/* settings */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;max-width:560px}
@media (max-width:640px){.set-grid{grid-template-columns:minmax(0,1fr)}}
.std{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.std th,.std td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.std th{background:var(--tint);font-weight:500;color:var(--ink-2);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.notice{background:var(--sev-a-bg);color:var(--sev-a);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-top:16px}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--sev-s)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.login{max-width:440px;margin:0 auto}
.stamp-btn.mine{color:var(--accent);font-weight:600}
.btn.danger{color:var(--sev-s);border-color:var(--sev-s)}
.login .form-sec .fld input{border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;background:var(--sheet);width:100%;font-size:15px}
@media (max-width:640px){.who span{display:none}}

/* ---------- AS 전용 ----------
   색은 클레임 보고서처럼 한 계열만 쓴다: 노랑(--brand) · 연노랑(--accent-soft) · 먹색(--ink) · 회색.
   손이 가야 하는 것(미연락·담당 미지정·예치금 차감)만 연노랑 바탕으로 띄우고 나머지는 회색. */
@media (max-width:640px){.tabs{order:3;width:100%;overflow-x:auto}.tab{white-space:nowrap}}

/* 구분 카드: 재직자 / 휴직자 / 퇴사자 현장 */
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:720px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gcard{border:1px solid var(--line);border-top:3px solid var(--line-2);background:var(--sheet);border-radius:var(--r);padding:12px 14px 11px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.gcard:hover{border-color:var(--ink-3)}
.gcard[aria-pressed="true"]{border-color:var(--brand);border-top-color:var(--brand);background:var(--accent-soft)}
.gcard small{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.gcard small em{font-style:normal;color:var(--ink-3);font-weight:500}
.gcard strong{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.gcard strong em{font-style:normal;font-size:13px;color:var(--ink-3);font-weight:500;margin-left:3px}
.gcard .warn{font-size:12px;color:var(--ink);font-weight:600;min-height:18px;display:flex;align-items:center;gap:5px}
.gcard .warn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
.gcard .warn.ok{color:var(--ink-3);font-weight:400}
.gcard .warn.ok::before{background:var(--line-2)}
.gtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap}

/* 진행 단계: 접수(손 가야 함)만 노랑, 진행 중은 연노랑, 끝난 건 회색 */
.st-0{color:var(--brand-ink);background:var(--brand)}
.st-1,.st-2{color:var(--ink);background:var(--accent-soft)}
.st-3{color:var(--ink);background:var(--tint)}
.st-4,.st-hold{color:var(--ink-3);background:var(--tint)}
.st-0::before{background:var(--brand-ink)}
.flag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap;line-height:1.5}
.flag.hot{background:var(--accent-soft);border-color:var(--brand);color:var(--ink);font-weight:600}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.over{color:var(--ink);font-weight:700}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.alert{border:1px solid var(--brand);color:var(--ink);background:var(--accent-soft);border-radius:var(--r);padding:6px 12px;font-size:13px;font-weight:600}
.alert[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.who-cell b{font-weight:600}
.who-cell span{display:block}

/* 상세: 단계 표시줄 */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:18px 0 4px}
.step{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink-3);font-size:12px;font-weight:500;min-width:0}
.step i{display:block;height:6px;border-radius:3px;background:var(--line)}
.step.done{color:var(--ink-2)} .step.done i{background:var(--brand)}
.step.cur{color:var(--ink);font-weight:700} .step.cur i{background:var(--brand);box-shadow:0 0 0 3px var(--accent-soft)}
button.step:hover{color:var(--ink)}
button.step:disabled{cursor:default;color:inherit}
.step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-sub{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}

/* 상세: 2단 (정보 | 진행 기록) */
.as-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:16px}
.as-head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.as-head .cust-line{color:var(--ink-2);margin-top:2px}
.as-actions{display:flex;gap:6px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols .doc{margin-top:0}
.side{position:sticky;top:64px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px}
@media (max-width:900px){.side{position:static}}
.side h2{font-size:15px;margin:0 0 2px}
.note-in{display:flex;flex-direction:column;gap:6px;margin:10px 0 16px}
.note-in textarea{border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;background:var(--sheet);width:100%;min-height:64px;resize:vertical}
.tl{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
.tl li{position:relative;padding:0 0 14px 18px;border-left:2px solid var(--line);margin-left:5px}
.tl li:last-child{border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--sheet);border:2px solid var(--line-2)}
.tl li.stage::before{background:var(--brand);border-color:var(--brand)}
.tl .meta{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl .txt{white-space:pre-wrap;word-break:break-word;font-size:13px}
.tl li.stage .txt{font-weight:600}
.tl .empty-tl{color:var(--ink-3);font-size:13px;border:0;padding:0;margin:0}
.tl .empty-tl::before{display:none}

/* 첨부 파일 (마감보고서 등) */
.files{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.files li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.files .ext{flex:none;font-family:var(--f-mono);font-size:10px;font-weight:600;background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:2px 5px;text-transform:uppercase}
.files a{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.files .size{color:var(--ink-3);font-size:12px;flex:none}
.files button{flex:none;border:0;background:none;color:var(--ink-3);font-size:12px}
.files button:hover{color:var(--ink)}
.file-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.file-pick label{cursor:pointer}
.pending{font-size:12px;color:var(--ink-2)}
.fld input[type=checkbox]{width:16px;height:16px;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px;padding:8px 0}
.fld .auto b{font-weight:700}

/* 처리 기준 */
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:720px){.rules{grid-template-columns:minmax(0,1fr)}}
.rule{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--sheet)}
.rule h3{margin:0 0 6px;font-size:14px}
.rule ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.rule li{margin:2px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px}
.flow span{border:1px solid var(--line-2);border-radius:999px;padding:4px 12px;background:var(--sheet)}
.flow span.key{background:var(--accent-soft);border-color:var(--brand);font-weight:600}
.flow i{font-style:normal;color:var(--ink-3)}
.filters > span{max-width:100%;display:inline-flex;align-items:center;min-width:0}
.seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap;flex:none}
.notify{background:var(--accent-soft);border:1px solid var(--brand);border-radius:var(--r);padding:14px 16px;margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 20px;align-items:start}
@media (max-width:720px){.notify{grid-template-columns:minmax(0,1fr)}}
.notify-txt b{display:block;font-size:14px}
.notify-txt span{font-size:12px;color:var(--ink-2)}
.notify-msg{grid-row:span 2;margin:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font:12px/1.6 var(--f-body);white-space:pre-wrap;word-break:break-all;color:var(--ink-2)}
@media (max-width:720px){.notify-msg{grid-row:auto}}
.notify-act{display:flex;gap:6px;flex-wrap:wrap;align-self:end}
.demo-bar{background:var(--accent-soft);color:var(--ink);text-align:center;font-size:12px;padding:4px 16px;font-weight:600}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><img src="logo.png" alt="홈루덴스" width="142" height="20"><span>AS 진행관리</span></div>
    <nav class="tabs" id="nav" aria-label="화면" hidden>
      <button class="tab" data-view="list">현황판</button>
      <button class="tab" data-view="people">담당자별</button>
      <button class="tab" data-view="guide">처리 기준</button>
    </nav>
    <button class="btn primary" id="btn-new" hidden>+ AS 접수</button>
    <div class="who" id="who" hidden><span id="who-email"></span><button class="btn ghost" id="btn-logout">로그아웃</button></div>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
